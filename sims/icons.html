<section class="panel icon-library" aria-label="Browse icons">
  <p>Browse the {{COUNT}} icons included with Healbot. Select an icon to view the full image. Artwork belongs to Blizzard Entertainment.</p>
  <label for="icon-search">Search icon filenames</label>
  <input id="icon-search" type="search" placeholder="Try nature, healing, or shield" autocomplete="off" aria-controls="icon-grid">
  <p data-icon-count role="status">{{COUNT}} icons</p>
  <p data-icon-empty hidden>No matching icons. Try another name or clear your search.</p>
  <div id="icon-grid"><!-- ICONS --></div>
  <noscript>All icons are listed below. Enable JavaScript to filter them by filename.</noscript>
</section>
<link rel="stylesheet" href="../assets/icons.css">
<script type="module" src="../assets/icons.mjs"></script>
