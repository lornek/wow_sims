<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warcraft Party &amp; Raid Unit Frames — 1:1 CSS Replica</title>

  <!-- STANDALONE PURE CSS FOR WARCRAFT UNIT FRAMES -->
  <style id="wow-pure-css">
:root {
  /* ========================================================================
     BLIZZARD PAINTED CLASS & ROLE VERTICAL GRADIENTS
     ======================================================================== */
  --grad-warrior: linear-gradient(180deg, #d6a874 0%, #b58654 52%, #8c6239 100%);
  --grad-paladin: linear-gradient(180deg, #f796c1 0%, #dc71a2 52%, #b84d7e 100%);
  --grad-mage:    linear-gradient(180deg, #58c4f6 0%, #349cd9 52%, #1c75bc 100%);
  --grad-druid:   linear-gradient(180deg, #ff8c24 0%, #df6b0e 52%, #b84a00 100%);
  --grad-priest:  linear-gradient(180deg, #ffffff 0%, #dce1e6 52%, #b4bcc4 100%);
  --grad-hunter:  linear-gradient(180deg, #b4dc76 0%, #8eb952 52%, #689432 100%);
  --grad-warlock: linear-gradient(180deg, #9b84d6 0%, #775eb5 52%, #563d94 100%);
  --grad-shaman:  linear-gradient(180deg, #1a8cff 0%, #0968db 52%, #0047b3 100%);

  /* Role Bar Gradients */
  --grad-tank:    linear-gradient(180deg, #2b7de9 0%, #1d5eba 52%, #13428c 100%);
  --grad-healer:  linear-gradient(180deg, #45c466 0%, #2f9c4b 52%, #1d7534 100%);
  --grad-dps:     linear-gradient(180deg, #e04343 0%, #b62b2b 52%, #8c1919 100%);

  /* Glossy Emerald Sub-Bar Gradient */
  --grad-emerald: linear-gradient(180deg, #52e048 0%, #28a822 55%, #167012 100%);
}

/* ==========================================================================
   1. OVERALL HOUSING & INTEGRATED PARTY / RAID TAB
   ========================================================================== */
.wow-housing {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.72));
}

/* Integrated Top-Left Tab ("Party" / "Raid") */
.wow-tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  padding: 3px 16px 4px 12px;
  margin-left: 4px;
  margin-bottom: -1.5px;
  z-index: 3;
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: #ffffff;
  text-shadow:
    0 1px 1px #000000,
    0 0 3px rgba(0, 0, 0, 0.95);
  background: linear-gradient(180deg, #212834 0%, #141921 100%);
  border: 1.5px solid #8a703f;
  border-bottom: 1.5px solid #141921;
  border-radius: 5px 5px 0 0;
  box-shadow:
    inset 0 1px 0 rgba(255, 232, 175, 0.42),
    inset 1px 0 0 rgba(255, 255, 255, 0.1),
    inset -1px 0 0 rgba(0, 0, 0, 0.5);
}

/* Tiny Decorative Gold Filigree Flourish under Bottom-Left of Tab */
.wow-tab::after {
  content: "";
  position: absolute;
  left: -3px;
  bottom: -4.5px;
  width: 14px;
  height: 5px;
  background: radial-gradient(ellipse at 35% 50%, #f6d379 0%, #b58938 65%, transparent 100%);
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  pointer-events: none;
}

/* Sleek Dark Slate-Charcoal Outer Container with 1.5px Metallic Gold/Bronze Rim */
.wow-frame-container {
  position: relative;
  display: inline-flex;
  align-items: stretch;
  gap: 3px;
  padding: 4px;
  background: linear-gradient(180deg, #151a22 0%, #10141a 100%);
  border: 1.5px solid #8c713e;
  border-radius: 6px;
  box-shadow:
    inset 0 0 0 1px #06080b,
    inset 0 1px 2px rgba(255, 230, 165, 0.18),
    0 4px 12px rgba(0, 0, 0, 0.65);
}

/* Recessed Dark Gutter Holding the Unit Cells */
.wow-frame-gutter {
  display: inline-flex;
  align-items: stretch;
  gap: 3px;
  padding: 2px;
  background: #080a0e;
  border-radius: 4px;
  box-shadow:
    inset 0 1px 3px rgba(0, 0, 0, 0.95),
    0 1px 0 rgba(255, 255, 255, 0.08);
}

/* ==========================================================================
   2. UNIT FRAME CELL (TWO-TIER RECESSED SLOT)
   ========================================================================== */
.wow-unit {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 2.5px;
  width: 84px;
  padding: 2px;
  background: #090c10;
  border: 1px solid #040507;
  border-radius: 5px;
  box-shadow:
    inset 0 1px 2px rgba(0, 0, 0, 0.9),
    0 1px 0 rgba(255, 255, 255, 0.07);
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  user-select: none;
  cursor: pointer;
  transition: transform 0.07s ease, filter 0.12s ease;
}

.wow-unit--pet-col {
  width: 158px;
}

.wow-unit--raid {
  width: 128px;
}

.wow-unit--raid-wide {
  width: 154px;
}

.wow-unit:hover {
  filter: brightness(1.04);
}

.wow-unit:active {
  transform: translateY(1px);
  filter: brightness(0.96);
}

/* A) TOP MAIN BAR (Class / Role Health Bar) */
.wow-main-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 29px;
  padding: 0 8px;
  border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, 0.85);
  background: var(--bar-bg, var(--grad-warrior));
  box-shadow:
    /* Crisp 1px top specular highlight */
    inset 0 1px 0 rgba(255, 255, 255, 0.58),
    /* Subtle side edge catchlights */
    inset 1px 0 0 rgba(255, 255, 255, 0.22),
    inset -1px 0 0 rgba(255, 255, 255, 0.22),
    /* Soft bottom inner bevel shadow */
    inset 0 -2px 3px rgba(0, 0, 0, 0.45),
    /* Pillowed dome inner glow */
    inset 0 0 8px rgba(255, 255, 255, 0.14);
  overflow: hidden;
}

.wow-unit--raid .wow-main-bar,
.wow-unit--raid-wide .wow-main-bar {
  height: 32px;
}

/* Class & Role Gradient Assignments */
.wow-bg-warrior { --bar-bg: var(--grad-warrior); }
.wow-bg-paladin { --bar-bg: var(--grad-paladin); }
.wow-bg-mage    { --bar-bg: var(--grad-mage); }
.wow-bg-druid   { --bar-bg: var(--grad-druid); }
.wow-bg-priest  { --bar-bg: var(--grad-priest); }
.wow-bg-hunter  { --bar-bg: var(--grad-hunter); }
.wow-bg-warlock { --bar-bg: var(--grad-warlock); }
.wow-bg-shaman  { --bar-bg: var(--grad-shaman); }
.wow-bg-tank    { --bar-bg: var(--grad-tank); }
.wow-bg-healer  { --bar-bg: var(--grad-healer); }
.wow-bg-dps     { --bar-bg: var(--grad-dps); }

/* Left-Aligned Crisp White Unit Name with Clean 1px Dark Outline/Shadow */
.wow-name {
  position: relative;
  z-index: 2;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  color: #ffffff;
  text-shadow:
    -1px -1px 0 rgba(0, 0, 0, 0.85),
     1px -1px 0 rgba(0, 0, 0, 0.85),
    -1px  1px 0 rgba(0, 0, 0, 0.85),
     1px  1px 0 rgba(0, 0, 0, 0.85),
     0 1px 2px rgba(0, 0, 0, 0.95);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* B) BOTTOM SUB-BAR (Glossy Emerald-Lime Secondary Bar) */
.wow-sub-bar-track {
  position: relative;
  width: 100%;
  height: 8px;
  background: #0b0e13;
  border-radius: 3px;
  border: 1px solid #040507;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.9);
  overflow: hidden;
}

.wow-sub-bar-fill {
  height: 100%;
  width: var(--val, 100%);
  border-radius: 2.5px;
  background: var(--grad-emerald);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 -1px 1px rgba(0, 0, 0, 0.45),
    1px 0 2px rgba(0, 0, 0, 0.8);
}

/* ==========================================================================
   3. ROW 2: DARK RECESSED PET ROW (PAW / FELHUNTER SWIRL + NAME)
   ========================================================================== */
.wow-pet-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 5px;
  background: linear-gradient(180deg, #1d222a 0%, #14181e 100%);
  border: 1px solid #06080b;
  border-radius: 3.5px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1px 2px rgba(0, 0, 0, 0.75);
}

.wow-pet-icon {
  width: 15px;
  height: 15px;
  border-radius: 3px;
  display: grid;
  place-items: center;
  background: #101318;
  border: 1px solid #6b7280;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
  flex-shrink: 0;
}

.wow-pet-icon--fel {
  background: radial-gradient(circle at 40% 35%, #6d28d9 0%, #2e1065 100%);
  border-color: #a855f7;
}

.wow-pet-label {
  font-size: 12px;
  font-weight: 700;
  color: #f3f4f6;
  text-shadow: 0 1px 1px #000000;
}

/* ==========================================================================
   4. ROW 3: CIRCULAR ROLE ICONS & OVERLAPPING DEBUFF TILES
   ========================================================================== */
.wow-role-circle {
  width: 21px;
  height: 21px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: radial-gradient(circle at 35% 30%, #3b4659 0%, #151a24 85%);
  border: 1.5px solid #cbd5e1;
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.65),
    0 1px 2px rgba(0, 0, 0, 0.85);
}

.wow-role-circle--tank {
  background: radial-gradient(circle at 35% 30%, #2563eb 0%, #1e3a8a 85%);
  border-color: #93c5fd;
}

.wow-role-circle--healer {
  background: radial-gradient(circle at 35% 30%, #16a34a 0%, #14532d 85%);
  border-color: #fef08a;
}

.wow-role-circle--dps {
  background: radial-gradient(circle at 35% 30%, #dc2626 0%, #7f1d1d 85%);
  border-color: #fca5a5;
}

/* Large 26x26 Rounded-Square Debuff Icon Overlapping Bottom-Right */
.wow-debuff-badge {
  position: absolute;
  right: 3px;
  bottom: 2px;
  z-index: 5;
  width: 26px;
  height: 26px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 45% 40%, #7e22ce 0%, #3b0764 75%, #1e0338 100%);
  border: 1.5px solid #d8b4fe;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.6),
    inset 0 -1px 2px rgba(0, 0, 0, 0.85),
    0 2px 5px rgba(0, 0, 0, 0.9);
}

.wow-debuff-badge--red {
  background: radial-gradient(circle at 45% 40%, #dc2626 0%, #7f1d1d 75%, #3b0707 100%);
  border-color: #fca5a5;
}

.wow-debuff-badge--fire {
  background: radial-gradient(circle at 45% 40%, #f59e0b 0%, #b45309 65%, #451a03 100%);
  border-color: #fde68a;
}

/* ==========================================================================
   5. ROWS 4 & 5: DISPEL HIGHLIGHT & ANIMATED PULSING GOLD BORDER
   ========================================================================== */
/* Row 4 - Mage: Bright Golden-Yellow Glowing Border */
.wow-dispel-bright {
  border-color: #ffd84d;
  box-shadow:
    inset 0 0 0 1px #fff3b0,
    0 0 8px 1px rgba(255, 216, 77, 0.9),
    0 0 16px 3px rgba(255, 179, 0, 0.55);
}

.wow-dispel-bright .wow-main-bar {
  border-color: #ffe885;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 0 6px rgba(255, 232, 133, 0.5),
    inset 0 -2px 3px rgba(0, 0, 0, 0.4);
}

/* Row 4 - Priest: Softer Pale-Gold Glowing Border */
.wow-dispel-soft {
  border-color: #ffe680;
  box-shadow:
    inset 0 0 0 0.5px rgba(255, 248, 200, 0.8),
    0 0 6px 1px rgba(255, 230, 128, 0.55),
    0 0 12px 2px rgba(255, 204, 77, 0.28);
}

.wow-dispel-soft .wow-main-bar {
  border-color: #ffefad;
}

/* Row 5 - Shaman: Intense Fiery Golden-Orange Animated Pulsing Aura */
.wow-dispel-animated {
  border-color: #fff6cc;
  animation: wow-gold-aura-pulse 1.35s ease-in-out infinite;
}

.wow-dispel-animated .wow-main-bar {
  border-color: #fff3b8;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.82),
    inset 0 0 10px rgba(255, 225, 110, 0.65),
    inset 0 -2px 3px rgba(0, 0, 0, 0.35);
}

/* Outer Pulsing Energy Corona Ring */
.wow-dispel-animated::before {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 7px;
  border: 2px solid #ffe47a;
  box-shadow:
    0 0 12px 2px rgba(255, 195, 36, 0.95),
    inset 0 0 8px rgba(255, 230, 128, 0.8);
  pointer-events: none;
  z-index: 4;
  animation: wow-gold-corona-flare 1.35s ease-in-out infinite;
}

@keyframes wow-gold-aura-pulse {
  0%, 100% {
    box-shadow:
      inset 0 0 0 1px #fff3b0,
      0 0 10px 2px rgba(255, 204, 51, 0.9),
      0 0 22px 5px rgba(255, 145, 0, 0.6);
  }
  50% {
    box-shadow:
      inset 0 0 0 1.5px #ffffff,
      0 0 16px 4px rgba(255, 234, 120, 1),
      0 0 32px 9px rgba(255, 162, 0, 0.88);
  }
}

@keyframes wow-gold-corona-flare {
  0%, 100% {
    opacity: 0.85;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.02, 1.045);
  }
}
  </style>

  <!-- Clean Presentation Stage Styling -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #0c131d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px 84px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #e2e8f0;
    }

    .replica-stage {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 26px;
      max-width: 100%;
    }

    /* Sleek Floating Bottom-Right Pill Toolbar */
    .floating-pill {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      background: rgba(16, 22, 32, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(180, 145, 78, 0.45);
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .pill-btn:active {
      transform: scale(0.97);
    }

    .pill-btn--view {
      background: #1e293b;
      color: #f8fafc;
    }

    .pill-btn--view:hover {
      background: #283548;
    }

    .pill-btn--copy {
      background: linear-gradient(180deg, #f5c351 0%, #c98d26 100%);
      color: #11161f;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .pill-btn--copy:hover {
      filter: brightness(1.06);
    }

    /* Clean Modal for Inspecting Pure CSS */
    .css-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 8, 13, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .css-modal-backdrop.is-open {
      display: flex;
    }

    .css-modal {
      width: 100%;
      max-width: 760px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: #111722;
      border: 1.5px solid #8c713e;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }

    .css-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #161e2c;
      border-bottom: 1px solid rgba(140, 113, 62, 0.35);
    }

    .css-modal-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #f7d98c;
    }

    .css-modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .css-modal-pre {
      margin: 0;
      padding: 16px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #a7f3d0;
      background: #090d14;
    }
  </style>
</head>
<body>

    <!-- ====================================================================
         ROW 1: PARTY — CLASS COLORS (Warrior, Paladin, Mage, Druid, Priest)
         ==================================================================== -->
    <div class="wow-housing">
      <div class="wow-tab">Party</div>
      <div class="wow-frame-container">
        <div class="wow-frame-gutter">
          <!-- Warrior -->
          <div class="wow-unit">

              <div class="wow-sub-bar-fill" style="--val: 100%;"></div>

          <div class="wow-unit">

    <!-- ====================================================================

      <div class="wow-tab">Party</div>

          <!-- Warlock + Felhunter -->
          <div class="wow-unit wow-unit--pet-col">

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====================================================================
         ROW 3: RAID — ROLE DEBUFFS (Tank, Healer, DPS)

      View CSS

    <button id="copyCssBtn" type="button" class="pill-btn pill-btn--copy">
      <span id="copyBtnText">Copy Pure CSS</span>
    </button>
  </div>

  <!-- Clean Modal to Inspect / Copy Standalone CSS -->
  <div id="cssModalBackdrop" class="css-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="cssModalTitle">
    <div class="css-modal">
      <div class="css-modal-header">
        <span id="cssModalTitle" class="css-modal-title">Standalone Warcraft Unit Frames CSS</span>
        <div class="css-modal-actions">
          <button id="modalCopyBtn" type="button" class="pill-btn pill-btn--copy" style="padding: 5px 12px; font-size: 12px;">
            <span id="modalCopyText">Copy CSS</span>
          </button>
          <button id="closeModalBtn" type="button" class="pill-btn pill-btn--view" style="padding: 5px 11px; font-size: 12px;">
            Close
          </button>
        </div>
      </div>
      <pre id="cssModalCode" class="css-modal-pre"></pre>
    </div>
  </div>

  <script>
    (function () {
      const pureCssEl = document.getElementById("wow-pure-css");
      const cssModalBackdrop = document.getElementById("cssModalBackdrop");
      const cssModalCode = document.getElementById("cssModalCode");
      const viewCssBtn = document.getElementById("viewCssBtn");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const copyCssBtn = document.getElementById("copyCssBtn");
      const copyBtnText = document.getElementById("copyBtnText");
      const modalCopyBtn = document.getElementById("modalCopyBtn");
      const modalCopyText = document.getElementById("modalCopyText");

      const standaloneCss = pureCssEl ? pureCssEl.textContent.trim() : "";
      if (cssModalCode) {
        cssModalCode.textContent = standaloneCss;
      }

      function copyPureCss(labelEl, defaultText) {
        try {
          const textarea = document.createElement("textarea");
          textarea.value = standaloneCss;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);

          labelEl.textContent = "Copied!";
          setTimeout(() => {
            labelEl.textContent = defaultText;
          }, 2000);
        } catch (err) {
          console.error("Failed to copy CSS:", err);
        }
      }

      viewCssBtn.addEventListener("click", () => {
        cssModalBackdrop.classList.add("is-open");
      });

      closeModalBtn.addEventListener("click", () => {
        cssModalBackdrop.classList.remove("is-open");
      });

      cssModalBackdrop.addEventListener("click", (e) => {
        if (e.target === cssModalBackdrop) {
          cssModalBackdrop.classList.remove("is-open");
        }
      });

      copyCssBtn.addEventListener("click", () => copyPureCss(copyBtnText, "Copy Pure CSS"));
      modalCopyBtn.addEventListener("click", () => copyPureCss(modalCopyText, "Copy CSS"));
    })();
  </script>
